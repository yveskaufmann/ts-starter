name: CI - Workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    name: Generator (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: sudo apt-get install -y zsh # to test the zsh completion
      - run: npm run format:check
      - run: npm test

  package:
    name: Published package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the package into an empty project and use it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y
          npm install ../yveskaufmann-ts-starter-*.tgz
          npx ts-starter --version
          npx ts-starter list
          npx ts-starter create app:ts demo --set description="CI" --set author="CI <ci@example.com>"
          test -f demo/package.json && test -f demo/.gitignore && test -f demo/.vscode/launch.json
          bash -n <(npx ts-starter completion bash)

  generated-project:
    name: Generated project (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install generator dependencies
        run: npm ci

      - name: Generate test project
        working-directory: ${{ runner.temp }}
        run: |
          node "$GITHUB_WORKSPACE/index.js" create app:ts test-project \
            --set description="CI test project" --set author="CI <ci@example.com>"

      - name: Install project dependencies
        working-directory: ${{ runner.temp }}/test-project
        run: npm install

      - name: Check formatting
        working-directory: ${{ runner.temp }}/test-project
        run: npx prettier --check .

      - name: Build
        working-directory: ${{ runner.temp }}/test-project
        run: npm run build

      - name: Test
        working-directory: ${{ runner.temp }}/test-project
        run: npm test
